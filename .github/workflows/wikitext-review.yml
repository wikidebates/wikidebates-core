{
	"name": "Validate wikitext lifecycle candidate",
	"on": {
		"push": {
			"branches": ["fix/wikitext-request-lifecycle"]
		}
	},
	"permissions": {"contents": "write"},
	"jobs": {
		"validate": {
			"if": "github.repository == 'wikidebates/wikidebates-core' && github.ref == 'refs/heads/fix/wikitext-request-lifecycle'",
			"runs-on": "ubuntu-24.04",
			"timeout-minutes": 10,
			"steps": [
				{"uses": "actions/checkout@v4", "with": {"fetch-depth": 2}},
				{
					"name": "Verify and apply the exact reviewed patch",
					"run": "test \"$(git rev-parse HEAD^)\" = 2a956ff2a644898e446618f5099ee6d490179342\npython3 - <<'PY'\nfrom pathlib import Path\nimport gzip, hashlib, os, subprocess\npayload = Path('.review/wikitext.patch.gz').read_bytes()\nassert hashlib.sha256(payload).hexdigest() == '62c6adbb2363da16da1d957fd182f07460a17c10c7f85f79da237ffea857833d'\npatch = Path(os.environ['RUNNER_TEMP']) / 'wikitext.patch'\npatch.write_bytes(gzip.decompress(payload))\nsubprocess.run(['git', 'apply', '--check', str(patch)], check=True)\nsubprocess.run(['git', 'apply', str(patch)], check=True)\nPY"
				},
				{"uses": "shivammathur/setup-php@v2", "with": {"php-version": "8.4", "extensions": "mbstring, intl, xml", "coverage": "none"}},
				{"uses": "actions/setup-node@v4", "with": {"node-version": "22"}},
				{
					"name": "PHP standalone and translation regression checks",
					"run": "php tests/run.php\nphp tools/buildI18n.php --check\npython3 tests/checkI18n.py"
				},
				{
					"name": "JavaScript regressions and translation checks",
					"run": "npm ci --prefix tests --ignore-scripts\nnpm test --prefix tests\nnode tests/i18n.js"
				},
				{
					"name": "Publish only the verified source tree on the review branch",
					"run": "git rm -- .review/wikitext.patch.gz .github/workflows/wikitext-review.yml\ngit add -- docs modules tests\ngit diff --cached --check\ntest \"$(git write-tree)\" = 1e672c1cec4fd92850f95e3a3ab1b49b07912a90\ngit config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\ngit commit -m 'Fix wikitext request lifecycle, language isolation and mobile sibling labels'\ngit push origin HEAD:refs/heads/fix/wikitext-request-lifecycle"
				}
			]
		}
	}
}
