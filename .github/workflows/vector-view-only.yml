name: Native Vector view-only file cache in disposable MediaWiki

on:
  pull_request:
    paths:
      - 'maintenance/prepareVectorViewCache.php'
      - 'maintenance/rebuildVectorViews.php'
      - 'src/Reading/CachePreparationQueue.php'
      - 'src/Reading/CachePreparationCommands.php'
      - 'src/Reading/CachePreparationResults.php'
      - 'src/Reading/AtomicVectorViewFileCache.php'
      - 'tests/readingFragments/vectorViewOnly.php'
      - 'tests/readingFragments/vector2022Toc.php'
      - 'tests/readingFragments/nativeVectorParity.php'
      - 'tests/readingFragments/vectorRebuildBatch.php'
      - 'tests/readingFragments/bootstrap.php'
      - '.github/workflows/vector-view-only.yml'

permissions:
  contents: read

jobs:
  vector:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring,intl,xml,dom,pdo_sqlite,sqlite3,curl
      - name: Verify native view-only script syntax
        run: |
          php -l maintenance/prepareVectorViewCache.php
          php -l maintenance/rebuildVectorViews.php
          php -l src/Reading/CachePreparationQueue.php
          php -l src/Reading/CachePreparationCommands.php
          php -l src/Reading/CachePreparationResults.php
          php -l src/Reading/AtomicVectorViewFileCache.php
          php -l tests/readingFragments/vectorViewOnly.php
          php -l tests/readingFragments/vector2022Toc.php
          php -l tests/readingFragments/nativeVectorParity.php
          php -l tests/readingFragments/vectorRebuildBatch.php
      - name: Prepare pinned disposable MediaWiki 1.43
        run: |
          LAB="$RUNNER_TEMP/wd-vector-view-$GITHUB_RUN_ID"
          python3 tests/minervaFileCache/prepare.py "$LAB"
          echo "WD_MINERVA_STUDY_ROOT=$LAB" >> "$GITHUB_ENV"
          export WD_MINERVA_STUDY_ROOT="$LAB"
          git init -q "$LAB/Cite"
          git -C "$LAB/Cite" fetch --quiet --depth=1 https://github.com/wikimedia/mediawiki-extensions-Cite.git 3f6a8e0395112bbdbe3b53732e259cad6375aaab
          git -C "$LAB/Cite" checkout --quiet --detach FETCH_HEAD
          install -d -m 0700 "$LAB/state/reading-cache" "$LAB/state/minerva-cache" "$LAB/state/desktop-cache"
          php tests/readingFragments/manage.php initialize
      - name: Assert single view file, zero history files and reused HTML
        run: php tests/readingFragments/vectorViewOnly.php
      - name: Assert anonymous Vector 2022 TOC survives CLI file preparation
        run: php tests/readingFragments/vector2022Toc.php
      - name: Compare native HTTP, core CLI, and Wikidebates view HTML, plus on-demand history cache
        run: php tests/readingFragments/nativeVectorParity.php
      - name: Verify view-only migration checkpoint, lock, edit priority and history preservation
        run: php tests/readingFragments/vectorRebuildBatch.php
