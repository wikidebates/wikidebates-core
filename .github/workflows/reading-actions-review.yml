{
	"name": "Validate reading actions candidate",
	"on": {"push": {"branches": ["fix/reading-actions-keyboard"]}},
	"permissions": {"contents": "write"},
	"jobs": {
		"validate": {
			"runs-on": "ubuntu-24.04",
			"timeout-minutes": 10,
			"steps": [
				{"uses": "actions/checkout@v4", "with": {"fetch-depth": 2}},
				{
					"name": "Verify and apply the exact reviewed patch",
					"run": "test \"$(git rev-parse HEAD^)\" = e76e6b74ef620fd6b2621ef556695b4f7111f791\ncat .review/reading-actions.part1 .review/reading-actions.part2 .review/reading-actions.part3 > \"$RUNNER_TEMP/reading-actions.gz\"\nprintf '6f236138bdf2bc72c6bba0be71d2a42d591723d09c08729a914bc7f42f1fda02  %s\\n' \"$RUNNER_TEMP/reading-actions.gz\" | sha256sum -c -\ngzip -dc \"$RUNNER_TEMP/reading-actions.gz\" > \"$RUNNER_TEMP/reading-actions.patch\"\ngit apply --check \"$RUNNER_TEMP/reading-actions.patch\"\ngit apply \"$RUNNER_TEMP/reading-actions.patch\""
				},
				{"uses": "shivammathur/setup-php@v2", "with": {"php-version": "8.4", "extensions": "mbstring, intl, xml", "coverage": "none"}},
				{"uses": "actions/setup-node@v4", "with": {"node-version": "22"}},
				{"name": "PHP 8.4 standalone regression suite and translations", "run": "php tests/run.php\nphp tools/buildI18n.php --check\npython3 tests/checkI18n.py"},
				{"name": "JavaScript regressions and messages", "run": "npm ci --prefix tests --ignore-scripts\nnpm test --prefix tests\nnode tests/i18n.js"},
				{
					"name": "Publish only the verified source tree on the review branch",
					"run": "git rm -- .review/reading-actions.part1 .review/reading-actions.part2 .review/reading-actions.part3 .github/workflows/reading-actions-review.yml\ngit add -- extension.json i18n modules tests docs\ngit diff --cached --check\ntest \"$(git write-tree)\" = a48ffc6379a54ef4959a1c831282b068e87e48a5\ngit config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\ngit commit -m 'Share clipboard actions, confirm copy results and support reading keyboard navigation'\ngit push origin HEAD:refs/heads/fix/reading-actions-keyboard"
				}
			]
		}
	}
}
