{
	"name": "Validate approved navigation fixes",
	"on": {"push": {"branches": ["fix/reading-navigation-links"]}},
	"permissions": {"contents": "write"},
	"jobs": {
		"validate": {
			"runs-on": "ubuntu-24.04",
			"timeout-minutes": 10,
			"steps": [
				{"uses": "actions/checkout@v4", "with": {"fetch-depth": 2}},
				{"name": "Verify and apply the reviewed patch", "run": "test \"$(git rev-parse HEAD^)\" = 5fc7d99dcd0eca98c8e019388e3bf94ba2269905\npython3 - <<'PY'\nfrom pathlib import Path\nimport gzip, hashlib, os, subprocess\npayload = Path('.review/navigation-links.patch.gz').read_bytes()\nassert hashlib.sha256(payload).hexdigest() == '5d58c019c7cbd6324ae429064f225c5941e22f3aeb8a341484d88981688f94aa'\npatch = Path(os.environ['RUNNER_TEMP']) / 'navigation-links.patch'\npatch.write_bytes(gzip.decompress(payload))\nsubprocess.run(['git', 'apply', '--check', str(patch)], check=True)\nsubprocess.run(['git', 'apply', str(patch)], check=True)\nPY"},
				{"uses": "shivammathur/setup-php@v2", "with": {"php-version": "8.4", "extensions": "mbstring, intl, xml", "coverage": "none"}},
				{"uses": "actions/setup-node@v4", "with": {"node-version": "22"}},
				{"name": "PHP 8.4 and translation checks", "run": "php tests/run.php\nphp tools/buildI18n.php --check\npython3 tests/checkI18n.py"},
				{"name": "JavaScript tests and messages", "run": "npm ci --prefix tests --ignore-scripts\nnpm test --prefix tests\nnode tests/i18n.js"},
				{"name": "Publish the exact verified source tree on the review branch", "run": "git rm -- .review/navigation-links.patch.gz .github/workflows/navigation-links-review.yml\ngit add -- modules tests docs\ngit diff --cached --check\ntest \"$(git write-tree)\" = e301263a6d015a8540880db32ea911ecdabd4160\ngit config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\ngit commit -m 'Keep reading action context per navigation entry and decode query titles once'\ngit push origin HEAD:refs/heads/fix/reading-navigation-links"}
			]
		}
	}
}
