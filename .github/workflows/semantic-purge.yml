name: Retired semantic-purge compatibility (PHP 8.4)

on:
  pull_request:
    paths:
      - 'src/Reading/SemanticCachePurgeJob.php'
      - 'tests/readingFragments/semanticPurgesRetired.php'
      - 'extension.json'
      - '.github/workflows/semantic-purge.yml'
  push:
    branches:
      - main
    paths:
      - 'src/Reading/SemanticCachePurgeJob.php'
      - 'tests/readingFragments/semanticPurgesRetired.php'
      - '.github/workflows/semantic-purge.yml'

permissions:
  contents: read

jobs:
  retired-semantic-purge:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Historic queued job does not invalidate cached pages
        run: |
          php -l src/Reading/SemanticCachePurgeJob.php
          php -l tests/readingFragments/semanticPurgesRetired.php
          php tests/readingFragments/semanticPurgesRetired.php
