{
	"name": "Validate reading concurrency candidate",
	"on": {
		"push": {
			"branches": ["perf/reading-concurrency"]
		}
	},
	"permissions": {"contents": "write"},
	"jobs": {
		"validate": {
			"runs-on": "ubuntu-24.04",
			"timeout-minutes": 10,
			"steps": [
				{"uses": "actions/checkout@v4", "with": {"fetch-depth": 2}},
				{
					"name": "Reconstitute and verify the exact reviewed patch",
					"run": "test \"$(git rev-parse HEAD^)\" = bc8a0af510fc3a6707946b105903908d29f4bd48\npython3 - <<'PY'\nfrom pathlib import Path\nimport base64, gzip, hashlib, os, subprocess\nfirst = bytearray(Path('.review/reading-concurrency.part1').read_bytes())\n# Normalize two identified transport transcription errors before verification.\nassert len(first) == 8100 and first[4791] == 124\nfirst[4791] = 120\nsecond = base64.b64encode(Path('.review/reading-concurrency.part2').read_bytes()).decode()\nassert second.count('NafVafV3') == 1\nsecond = second.replace('NafVafV3', 'NafV3').rstrip('=')\nsecond = base64.b64decode(second + '=' * (-len(second) % 4))\npayload = bytes(first) + second\nassert hashlib.sha256(payload).hexdigest() == '00d037b84b9f08eaf39c9cfb96ee4c558245eefdd30d9d16ba72e5f1979ff360'\npatch = Path(os.environ['RUNNER_TEMP']) / 'reading-concurrency.patch'\npatch.write_bytes(gzip.decompress(payload))\nsubprocess.run(['git', 'apply', '--check', str(patch)], check=True)\nsubprocess.run(['git', 'apply', str(patch)], check=True)\nPY"
				},
				{"uses": "shivammathur/setup-php@v2", "with": {"php-version": "8.4", "extensions": "mbstring, intl, xml", "coverage": "none"}},
				{"uses": "actions/setup-node@v4", "with": {"node-version": "22"}},
				{"name": "PHP syntax and full standalone regressions", "run": "find src debatephp/src tests maintenance -name '*.php' -print0 | xargs -0 -n1 php -l > /tmp/php-lint.log\nphp tests/run.php"},
				{"name": "Translation validation", "run": "php tools/buildI18n.php --check\npython3 tests/checkI18n.py"},
				{"name": "JavaScript regressions", "run": "npm ci --prefix tests --ignore-scripts\nnpm test --prefix tests\nnode tests/i18n.js"},
				{
					"name": "Publish only the exact validated source tree on the review branch",
					"run": "git rm -- .review/reading-concurrency.part1 .review/reading-concurrency.part2 .github/workflows/reading-concurrency-workspace.yml\ngit add -- src modules tests docs .github/workflows/native-html.yml\ngit diff --cached --check\ntest \"$(git write-tree)\" = 8794f9e169d43138bb9356dfb99ae71296134352\ngit config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\ngit commit -m 'Share cache read locks, prioritize foreground page reads and extend 1.43 CI'\ngit push origin HEAD:refs/heads/perf/reading-concurrency"
				}
			]
		}
	}
}
