{
	"name": "Native MediaWiki, SMW and SEO contracts",
	"on": {
		"pull_request": {
			"paths": [
				".github/workflows/seo-legacy-projection.yml",
				"tests/fullstack.php",
				"tests/mediawikiEnvironment.php",
				"debatephp/tests/integration/check_schema_vocabulary.py",
				"debatephp/src/JsonData.php",
				"debatephp/src/MediaWikiContext.php",
				"debatephp/src/SchemaData.php",
				"debatephp/src/DebateRenderer.php",
				"debatephp/src/ArgumentRenderer.php",
				"tests/mediawikiVariables.php",
				"tests/fullstackNativeSemantic.php",
				"tests/fullstackArgumentMapCases.php",
				"debatephp/src/ArgumentMap.php",
				"debatephp/src/Hooks.php",
				"debatephp/DebatePHP.i18n.magic.php",
				"tests/fullstackNativeReads.php",
				"debatephp/src/NativeSemanticApi.php",
				"src/LuaUsageAudit.php",
				"maintenance/AuditLuaUsage.php",
				"tests/mediawikiLuaUsageAudit.php",
				"lua-archive/**",
				"tests/mediawikiLuaArchive.php",
				"tests/mediawikiRegistrationDefaults.php",
				"src/Registration.php",
				"debatephp/tests/argument_contract.py",
				"debatephp/tests/fixtures/argument-cases.json",
				"debatephp/tests/fixtures/argument-contract.json",
				"debatephp/src/**",
				"debatephp/tests/argument_context.php",
				"debatephp/tests/serialized_contract.py",
				"debatephp/tests/serialized_native.php",
				"debatephp/tests/i18n_contract.py",
				"debatephp/tests/i18n_native.php",
				"debatephp/tests/fixtures/*-contract.json",
				"i18n/**",
				"resources/i18n-map.json",
				"resources/wiki-names.json",
				"tests/fullstackRender.php",
				"debatephp/tests/integration/fullstack_contract.py",
				"debatephp/tests/fixtures/fullstack-contract.json",
				"tests/fullstackDatabaseErrors.php",
				"tests/fullstackSupport.php",
				"tests/fullstackParentLink.php",
				"tests/renderCases.php",
				"tests/nativeOptimizationCases.php",
				"debatephp/tests/fixtures/**",
				"debatephp/tests/integration/html_contract.py",
				"tests/run.php",
				"tests/i18n.php",
				"debatephp/resources/**"
			]
		},
		"workflow_dispatch": {}
	},
	"permissions": {
		"contents": "read"
	},
	"jobs": {
		"projection": {
			"runs-on": "ubuntu-24.04",
			"timeout-minutes": 10,
			"steps": [
				{
					"uses": "actions/checkout@v7.0.1"
				},
				{
					"uses": "shivammathur/setup-php@v2",
					"with": {
						"php-version": "8.4",
						"extensions": "mbstring, intl, xml",
						"coverage": "none"
					}
				},
				{
					"uses": "actions/setup-python@v7.1.0",
					"with": {
						"python-version": "3.12"
					}
				},
				{
					"name": "Verify frozen Argument contract without Lua",
					"run": "python3 debatephp/tests/argument_contract.py php"
				},
				{
					"name": "Verify frozen text contract without Lua",
					"run": "python3 debatephp/tests/serialized_contract.py php"
				},
				{
					"name": "Verify frozen translation contract without Lua",
					"run": "python3 debatephp/tests/i18n_contract.py php"
				}
			]
		},
		"fullstack": {
			"runs-on": "ubuntu-24.04",
			"timeout-minutes": 30,
			"steps": [
				{
					"uses": "actions/checkout@v7.0.1"
				},
				{
					"uses": "shivammathur/setup-php@v2",
					"with": {
						"php-version": "8.4",
						"extensions": "mbstring, intl, xml, pdo_sqlite, sqlite3, curl",
						"coverage": "none",
						"tools": "composer"
					}
				},
				{
					"uses": "actions/checkout@v7.0.1",
					"name": "MediaWiki 1.43.12",
					"with": {
						"repository": "wikimedia/mediawiki",
						"ref": "1.43.12",
						"path": ".seo-lab/mediawiki"
					}
				},
				{
					"uses": "actions/checkout@v7.0.1",
					"name": "Pinned Scribunto",
					"with": {
						"repository": "wikimedia/mediawiki-extensions-Scribunto",
						"ref": "0d1951dafab4b3dc7004f37ba420565b8fd3c871",
						"path": ".seo-lab/mediawiki/extensions/Scribunto"
					}
				},
				{
					"uses": "actions/checkout@v7.0.1",
					"name": "Pinned ParserFunctions",
					"with": {
						"repository": "wikimedia/mediawiki-extensions-ParserFunctions",
						"ref": "f1a2626836e3b4448e5ceeb4eca20880e6357b87",
						"path": ".seo-lab/mediawiki/extensions/ParserFunctions"
					}
				},
				{
					"uses": "actions/checkout@v7.0.1",
					"name": "Pinned Cite",
					"with": {
						"repository": "wikimedia/mediawiki-extensions-Cite",
						"ref": "77ddf98f9ea40e8baf57660ff5ae760831f6700a",
						"path": ".seo-lab/mediawiki/extensions/Cite"
					}
				},
				{
					"uses": "actions/checkout@v7.0.1",
					"name": "Pinned SemanticMediaWiki",
					"with": {
						"repository": "SemanticMediaWiki/SemanticMediaWiki",
						"ref": "448a112ac897ff6a4b615cf0703cf60ed946907f",
						"path": ".seo-lab/mediawiki/extensions/SemanticMediaWiki"
					}
				},
				{
					"uses": "actions/checkout@v7.0.1",
					"name": "Pinned Variables",
					"with": {
						"repository": "wikimedia/mediawiki-extensions-Variables",
						"ref": "12ad832a68e1a002c821f5d1c127b04ac047181e",
						"path": ".seo-lab/mediawiki/extensions/Variables"
					}
				},
				{
					"uses": "actions/checkout@v7.0.1",
					"name": "Pinned PageForms",
					"with": {
						"repository": "wikimedia/mediawiki-extensions-PageForms",
						"ref": "619e233c9ec66a69dfc2c8d50d8d1ce4c6e84484",
						"path": ".seo-lab/mediawiki/extensions/PageForms"
					}
				},
				{
					"uses": "actions/checkout@v7.0.1",
					"name": "Pinned ShortDescription",
					"with": {
						"repository": "StarCitizenTools/mediawiki-extensions-ShortDescription",
						"ref": "683dde18ac00fcfebde0fbfb59fe1552c171386c",
						"path": ".seo-lab/mediawiki/extensions/ShortDescription"
					}
				},
				{
					"uses": "actions/checkout@v7.0.1",
					"name": "Pinned WikiSEO",
					"with": {
						"repository": "wikidebates/WikiSEO",
						"ref": "ca976844f6a8c038080684cf566aaaa4093cef9c",
						"path": ".seo-lab/mediawiki/extensions/WikiSEO"
					}
				},
				{
					"name": "Install the historical locked SMW dependencies in the disposable laboratory",
					"run": "composer install --working-dir=.seo-lab/mediawiki --no-interaction --prefer-dist --no-progress\nmkdir -p .seo-lab/dependencies .seo-lab/results\ncp tests/fullstack-dependencies/composer.json tests/fullstack-dependencies/composer.lock .seo-lab/dependencies/\ncomposer --working-dir=.seo-lab/dependencies install --no-dev --no-interaction --no-plugins --no-scripts --prefer-dist --no-progress"
				},
				{
					"name": "Audit real Lua modules and all current wiki slots without parsing during the scan",
					"env": {
						"MW_INSTALL_PATH": "${{ github.workspace }}/.seo-lab/mediawiki"
					},
					"run": "php tests/mediawikiLuaUsageAudit.php"
				},
				{
					"name": "Verify historical Scribunto revisions after replacing the runtime with an inert archive",
					"env": {
						"MW_INSTALL_PATH": "${{ github.workspace }}/.seo-lab/mediawiki"
					},
					"run": "find lua-archive -name '*.php' -print0 | xargs -0 -n1 php -l\nlab=$(mktemp -d \"${TMPDIR:-/tmp}/wd-lua-archive-test.XXXXXXXX\")\ntrap 'rm -rf \"$lab\"' EXIT\nphp tests/mediawikiLuaArchive.php seed \"$lab\"\nphp tests/mediawikiLuaArchive.php verify \"$lab\"\nphp tests/mediawikiLuaArchive.php verify-integrated \"$lab\"\nphp tests/mediawikiLuaArchive.php verify-both \"$lab\"\nfor lang in fr en de es it pt; do php tests/mediawikiRegistrationDefaults.php \"$lang\"; done\nphp tests/mediawikiRegistrationDefaults.php fr disabled\nphp tests/mediawikiRegistrationDefaults.php fr legacy"
				},
				{
					"name": "Verify native Variables without loading any Lua extension",
					"env": {
						"MW_INSTALL_PATH": "${{ github.workspace }}/.seo-lab/mediawiki"
					},
					"run": "php tests/mediawikiVariables.php"
				},
				{
					"name": "Exercise the complete native render corpus without any Lua extensions",
					"env": {
						"MW_INSTALL_PATH": "${{ github.workspace }}/.seo-lab/mediawiki",
						"WD_FULLSTACK_AUTOLOAD": "${{ github.workspace }}/.seo-lab/dependencies/vendor/autoload.php",
						"WD_FULLSTACK_NATIVE_RENDER": "1",
						"WD_FULLSTACK_RENDER_OUTPUT": "${{ github.workspace }}/.seo-lab/results/native-renders.json",
						"WD_FULLSTACK_OUTPUT": "${{ github.workspace }}/.seo-lab/results/native-summary.json"
					},
					"run": "php -d memory_limit=768M tests/fullstackNativeSemantic.php"
				},
				{
					"name": "Verify frozen complete native render contract",
					"run": "python3 debatephp/tests/integration/fullstack_contract.py .seo-lab/results/native-renders.json"
				},
				{
					"name": "Check native graph vocabulary against official Schema.org 30.1",
					"run": "curl --fail --silent --show-error --location --retry 3 --max-time 60 https://raw.githubusercontent.com/schemaorg/schemaorg/5f2d8cdec99b7329459ef6584e94b6a840f88471/data/releases/30.1/schemaorg-current-https.jsonld -o .seo-lab/schemaorg-30.1.jsonld\ntest \"$(git hash-object .seo-lab/schemaorg-30.1.jsonld)\" = d04621d491eff20f3a8defe7bd4351a16db75e42\npython3 debatephp/tests/integration/check_schema_vocabulary.py .seo-lab/schemaorg-30.1.jsonld .seo-lab/results/native-renders.json .seo-lab/results/native-schema-vocabulary.json"
				},
				{
					"name": "Retain isolated diagnostics even on comparison failure",
					"uses": "actions/upload-artifact@v7.0.2",
					"if": "always()",
					"with": {
						"name": "native-fullstack",
						"path": ".seo-lab/results/*.json",
						"if-no-files-found": "ignore",
						"include-hidden-files": true
					}
				}
			]
		}
	}
}
