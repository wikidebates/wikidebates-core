name: WikiSEO and Wikidebates page opt-out integration (MW 1.43)

on:
  pull_request:
    paths:
      - 'src/Seo/Metadata.php'
      - 'debatephp/src/MediaWikiContext.php'
      - 'debatephp/src/ReferenceRenderer.php'
      - 'debatephp/src/ArgumentReferenceRenderer.php'
      - 'tests/seo.php'
      - 'extension.json'
      - 'tests/seoCoexistence.php'
      - 'tests/seoCacheInvalidation.php'
      - 'tests/seoBenchmark.php'
      - 'docs/native-seo-migration.md'
      - '.github/workflows/wikiseo-page-optout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wikiseo-optout:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, xml, pdo_sqlite, sqlite3
          coverage: none
          tools: composer
      - name: MediaWiki 1.43.12
        uses: actions/checkout@v7
        with:
          repository: wikimedia/mediawiki
          ref: 1.43.12
          path: .mw-lab
      - name: Modernized WikiSEO (production baseline)
        uses: actions/checkout@v7
        with:
          repository: wikidebates/WikiSEO
          # Exact WikiSEO gitlink in farm main 6f1300fd2802 (2026-11-24).
          ref: ca976844f6a8c038080684cf566aaaa4093cef9c
          path: .mw-lab/extensions/WikiSEO
      - name: Install isolated MediaWiki vendor dependencies
        working-directory: .mw-lab
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Real hooks, JSON-LD and page metadata coexistence
        env:
          MW_INSTALL_PATH: ${{ github.workspace }}/.mw-lab
          WD_TEST_EXTENSIONS: WikiSEO
        run: |
          php -d display_errors=1 -d error_reporting=E_ALL tests/seoCoexistence.php
          php -d display_errors=1 -d error_reporting=E_ALL tests/seoCacheInvalidation.php
          php -d display_errors=1 -d error_reporting=E_ALL tests/mediawiki.php
      - name: Measure pre-optimization baseline on the same runner (informational)
        env:
          MW_INSTALL_PATH: ${{ github.workspace }}/.mw-lab
          WD_TEST_EXTENSIONS: WikiSEO
        run: |
          baseline=07cc741fd9bbe768ef182a1c123f8c634d4a82f8
          git fetch --no-tags --depth=1 origin "$baseline"
          worktree="$RUNNER_TEMP/wd-seo-before"
          git worktree add --detach "$worktree" "$baseline"
          trap 'git worktree remove --force "$worktree"' EXIT
          echo "WD_SEO_BEFORE $baseline"
          php -d display_errors=1 -d error_reporting=E_ALL "$worktree/tests/seoBenchmark.php"
      - name: Measure isolated SEO hook cost (informational)
        env:
          MW_INSTALL_PATH: ${{ github.workspace }}/.mw-lab
          WD_TEST_EXTENSIONS: WikiSEO
        run: php -d display_errors=1 -d error_reporting=E_ALL tests/seoBenchmark.php
