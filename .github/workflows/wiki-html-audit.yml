name: Probe Wikidebates public API (read only)

on:
  push:
    branches:
      - fix/remove-html-tags-dependency
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Public MediaWiki API probes
        run: |
          php -r '
            foreach (["fr", "en"] as $lang) {
              $base = "https://".$lang.".wikidebates.org/w/api.php";
              $url = $base."?".http_build_query(["action"=>"query","meta"=>"siteinfo","siprop"=>"namespaces","format"=>"json"]);
              $context = stream_context_create(["http"=>[
                "method"=>"GET",
                "timeout"=>12,
                "ignore_errors"=>true,
                "header"=>"User-Agent: WikidebatesHtmlTagsAudit/1.0 (GitHub Actions public read-only audit)\r\nAccept: application/json\r\n"
              ]]);
              $data = @file_get_contents($url, false, $context);
              $status = $http_response_header[0] ?? "no HTTP status";
              $response = is_string($data) ? substr($data, 0, 600) : "unavailable";
              echo $lang.": ".$status."\n".$response."\n";
            }
          '
