{
	"name": "Wikidebates 1.43 regression checks",
	"on": {
		"push": {
			"branches": [
				"main"
			]
		},
		"pull_request": null
	},
	"permissions": {
		"contents": "read"
	},
	"jobs": {
		"php": {
			"runs-on": "ubuntu-24.04",
			"strategy": {
				"fail-fast": false,
				"matrix": {
					"php": [
						"8.3",
						"8.4"
					]
				}
			},
			"steps": [
				{
					"uses": "actions/checkout@v7.0.1"
				},
				{
					"uses": "shivammathur/setup-php@v2",
					"with": {
						"php-version": "${{ matrix.php }}",
						"extensions": "mbstring, intl, xml",
						"coverage": "none"
					}
				},
				{
					"name": "PHP syntax",
					"run": "find debatephp/src src tests maintenance -name '*.php' -print0 | xargs -0 -n1 php -l > /tmp/php-lint.log\ntail -n 5 /tmp/php-lint.log\n"
				},
				{
					"name": "Standalone regression tests",
					"run": "php tests/run.php"
				},
				{
					"name": "Reading prewarm safety runner smoke tests",
					"run": "bash tests/readingFragments/runnerSmoke.sh"
				},
				{
					"name": "Translation generation and catalog checks",
					"run": "php tools/buildI18n.php --check\npython3 tests/checkI18n.py"
				}
			],
			"timeout-minutes": 10
		},
		"mediawiki-143": {
			"runs-on": "ubuntu-24.04",
			"timeout-minutes": 20,
			"steps": [
				{
					"uses": "actions/checkout@v7.0.1"
				},
				{
					"uses": "shivammathur/setup-php@v2",
					"with": {
						"php-version": "${{ matrix.php }}",
						"extensions": "mbstring, intl, xml, pdo_sqlite, sqlite3",
						"coverage": "none",
						"tools": "composer"
					}
				},
				{
					"name": "MediaWiki 1.43.11 checkout",
					"uses": "actions/checkout@v7.0.1",
					"with": {
						"repository": "wikimedia/mediawiki",
						"ref": "1.43.11",
						"path": ".mw-lab"
					}
				},
				{
					"name": "MediaWiki vendor dependencies",
					"working-directory": ".mw-lab",
					"run": "composer install --no-interaction --prefer-dist --no-progress"
				},
				{
					"name": "MediaWiki 1.43 isolated integration",
					"env": {
						"MW_INSTALL_PATH": "${{ github.workspace }}/.mw-lab"
					},
					"run": "php tests/mediawiki.php"
				},
				{
					"name": "Pinned WikiSEO 2.7.0 checkout (PHP 8.4 only)",
					"if": "${{ matrix.php == '8.4' }}",
					"uses": "actions/checkout@v7.0.1",
					"with": {
						"repository": "wikimedia/mediawiki-extensions-WikiSEO",
						"ref": "3b135415f9fe0eff4d23659b4143bd50009238ab",
						"path": ".mw-lab/extensions/WikiSEO"
					}
				},
				{
					"name": "Selective SEO takeover with real WikiSEO (isolated)",
					"if": "${{ matrix.php == '8.4' }}",
					"env": {
						"MW_INSTALL_PATH": "${{ github.workspace }}/.mw-lab",
						"WD_TEST_EXTENSIONS": "WikiSEO"
					},
					"run": "php tests/seoCoexistence.php\nphp tests/mediawiki.php"
				},
				{
					"name": "Read-only semantic purge queue inspection (isolated SQLite)",
					"env": {
						"MW_INSTALL_PATH": "${{ github.workspace }}/.mw-lab"
					},
					"run": "php tests/queueInspector.php"
				}
			],
			"strategy": {
				"fail-fast": false,
				"matrix": {
					"php": [
						"8.3",
						"8.4"
					]
				}
			}
		},
		"javascript": {
			"runs-on": "ubuntu-24.04",
			"steps": [
				{
					"uses": "actions/checkout@v7.0.1"
				},
				{
					"uses": "actions/setup-node@v7.1.0",
					"with": {
						"node-version": "22",
						"cache": "npm",
						"cache-dependency-path": "tests/package-lock.json"
					}
				},
				{
					"name": "Install isolated JavaScript test dependencies",
					"run": "npm ci --prefix tests --ignore-scripts"
				},
				{
					"name": "JavaScript unit tests (including the AJAX client)",
					"run": "npm test --prefix tests"
				},
				{
					"name": "JavaScript message checks",
					"run": "node tests/i18n.js"
				}
			],
			"timeout-minutes": 10
		},
		"browser": {
			"runs-on": "ubuntu-24.04",
			"timeout-minutes": 15,
			"steps": [
				{
					"uses": "actions/checkout@v7.0.1"
				},
				{
					"uses": "actions/setup-node@v7.1.0",
					"with": {
						"node-version": "22",
						"cache": "npm",
						"cache-dependency-path": "tests/package-lock.json"
					}
				},
				{
					"name": "Install locked browser test dependencies",
					"run": "npm ci --prefix tests --ignore-scripts"
				},
				{
					"name": "Install Chromium matching the locked Playwright version",
					"run": "node tests/node_modules/playwright-core/cli.js install --with-deps chromium"
				},
				{
					"name": "Vector and Minerva browser regressions",
					"run": "CHROMIUM_PATH=\"$(node -p 'require(\"./tests/node_modules/playwright-core\").chromium.executablePath()')\"\nexport CHROMIUM_PATH\ntest -x \"$CHROMIUM_PATH\"\nnpm run test:browser --prefix tests"
				}
			]
		}
	}
}
