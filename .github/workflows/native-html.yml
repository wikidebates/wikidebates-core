name: Native HTML PHP checks

on:
  push:
    branches:
      - fix/remove-html-tags-dependency
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, xml
          coverage: none
      - name: PHP syntax
        run: |
          find debatephp/src src tests -name '*.php' -print0 | xargs -0 -n1 php -l > /tmp/php-lint.log
          tail -n 5 /tmp/php-lint.log
      - name: Standalone regression tests
        run: php tests/run.php
