name: Wikidebates 1.43 regression checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, xml
          coverage: none
      - name: PHP syntax
        run: |
          find debatephp/src src tests maintenance -name '*.php' -print0 | xargs -0 -n1 php -l > /tmp/php-lint.log
          tail -n 5 /tmp/php-lint.log
      - name: Standalone regression tests
        run: php tests/run.php
  mediawiki-143:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, xml, pdo_sqlite, sqlite3
          coverage: none
          tools: composer
      - name: MediaWiki 1.43.11 checkout
        uses: actions/checkout@v4
        with:
          repository: wikimedia/mediawiki
          ref: '1.43.11'
          path: .mw-lab
      - name: MediaWiki vendor dependencies
        working-directory: .mw-lab
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: MediaWiki 1.43 isolated integration
        env:
          MW_INSTALL_PATH: ${{ github.workspace }}/.mw-lab
        run: php tests/mediawiki.php
  javascript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install isolated JavaScript test dependencies
        run: npm ci --prefix tests --ignore-scripts
      - name: JavaScript unit tests (including the AJAX client)
        run: npm test --prefix tests

  smw-143:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, xml, pdo_sqlite, sqlite3
          coverage: none
          tools: composer
      - name: MediaWiki 1.43.11 checkout
        uses: actions/checkout@v4
        with:
          repository: wikimedia/mediawiki
          ref: '1.43.11'
          path: .mw-lab
      - name: Scribunto for MediaWiki 1.43
        uses: actions/checkout@v4
        with:
          repository: wikimedia/mediawiki-extensions-Scribunto
          ref: REL1_43
          path: .mw-lab/extensions/Scribunto
      - name: Exact SMW 7.3.1
        uses: actions/checkout@v4
        with:
          repository: SemanticMediaWiki/SemanticMediaWiki
          ref: 7.3.1
          path: .mw-lab/extensions/SemanticMediaWiki
      - name: Exact SemanticScribunto 2.3.3
        uses: actions/checkout@v4
        with:
          repository: SemanticMediaWiki/SemanticScribunto
          ref: 2.3.3
          path: .mw-lab/extensions/SemanticScribunto
      - name: Isolated dependency installs
        run: |
          composer install --working-dir=.mw-lab --no-interaction --prefer-dist --no-progress
          # This CI lab needs runtime SMW requirements, not its developer
          # linters; keep Composer security-advisory blocking enabled.
          php -r '$p=".mw-lab/extensions/SemanticMediaWiki/composer.json"; $data=json_decode(file_get_contents($p), true, 512, JSON_THROW_ON_ERROR); unset($data["require-dev"]); file_put_contents($p, json_encode($data, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . "\n");'
          composer install --working-dir=.mw-lab/extensions/SemanticMediaWiki --no-dev --no-interaction --prefer-dist --no-progress
          composer install --working-dir=.mw-lab/extensions/SemanticScribunto --no-dev --no-interaction --prefer-dist --no-progress
      - name: Real SMW query dependency and purge tests on SQLite
        env:
          MW_INSTALL_PATH: ${{ github.workspace }}/.mw-lab
        run: php -d memory_limit=768M tests/fullstackSemanticCache.php
